[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "klibgen-build"
version = "0.2.0"
description = "Recipe, artifact, and session coordinator for KlibGen-GT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.4,<9",
    "plumbum>=1.10.0,<2",
    "pydantic>=2.13,<3",
]

[project.scripts]
klibgen-build = "klibgen_build.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["klibgen_build", "klibgen_build.cli"]
