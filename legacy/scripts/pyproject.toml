[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "klibgen-scripts"
version = "0.1.0"
description = "Utility scripts for klibgen"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0",
]

[project.scripts]
transform-xsl-shim = "klibgen.transform_xsl_shim:main"

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mypy>=1.18",
    "pytest>=8.0",
    "ruff>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/klibgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "PERF", # Perflint
    "PIE",  # flake8-pie
    "PL",   # Pylint
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # Ruff-specific rules
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
